services:
  mongo:
    image: mongo:7
    restart: on-failure
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ${BASE44_PROJECT_ROOT}
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app/backend
        RUN apt-get update && apt-get install -y --no-install-recommends gcc curl && rm -rf /var/lib/apt/lists/*
        COPY backend/requirements.txt /tmp/requirements.txt
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
    restart: on-failure
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
    working_dir: /app/backend
    command: ["sh", "-ec", "exec uvicorn server:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/backend"]
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=clubvel
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/auth/notification-status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ${BASE44_PROJECT_ROOT}
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
        RUN corepack enable
        WORKDIR /app/frontend
        COPY frontend/package.json frontend/yarn.lock ./
        RUN yarn install --frozen-lockfile
    restart: on-failure
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - web_node_modules:/app/frontend/node_modules
    working_dir: /app/frontend
    command: ["sh", "-ec", "exec npx expo start --web --port 3000 --host lan"]
    ports:
      - "3000:3000"
    environment:
      - EXPO_PUBLIC_BACKEND_URL=https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  mongo_data:
  web_node_modules:
