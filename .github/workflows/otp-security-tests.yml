name: OTP security unit tests
on:
  pull_request:
    paths:
      - 'backend/services/auth_otp.py'
      - 'backend/tests/test_otp_delivery_security.py'
      - '.github/workflows/otp-security-tests.yml'
  workflow_dispatch:

jobs:
  otp-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notification status test dependency
        run: python -m pip install python-dotenv==1.2.1
      - name: Run offline OTP regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_otp_delivery_security.py' -v
