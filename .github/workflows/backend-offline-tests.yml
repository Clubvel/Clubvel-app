name: Backend offline regression suite
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - '.github/workflows/backend-offline-tests.yml'
  workflow_dispatch:

jobs:
  backend-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHON_DOTENV_DISABLED: 'true'
      MONGO_URL: mongodb://127.0.0.1:1
      DB_NAME: clubvel_offline_ci
      JWT_SECRET_KEY: offline-only-not-a-real-secret
      FIELD_ENCRYPTION_KEY: offline-only-not-a-real-secret
      ENABLE_REAL_NOTIFICATIONS: 'false'
      PRODUCTION_MODE: 'false'
      CLUBVEL_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run complete repository backend tests without external services
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run backend OTP security tests
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_otp_delivery_security.py' -v
