name: Product state validation
on:
  pull_request:
    branches: [person-first-final]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Backend syntax
        run: python -m py_compile backend/server.py backend/services/notification_service.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit
